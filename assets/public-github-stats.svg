    <text x="265" y="79" text-anchor="end" class="value">2</text>

    <text x="0" y="103" class="label">◷  COMMITS // LAST YEAR</text>
    <text x="265" y="103" text-anchor="end" class="value">409</text>

    <text x="0" y="127" class="label">⑂  PULL REQUESTS</text>
