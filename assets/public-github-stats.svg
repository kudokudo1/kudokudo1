<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195">
  <rect width="495" height="195" rx="8" fill="#1B0623"/>
  <rect x="0.5" y="0.5" width="494" height="194" rx="8" fill="none" stroke="#55CFCA" stroke-opacity="0.85"/>

  <style>
