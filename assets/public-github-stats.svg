  <circle cx="407" cy="108" r="45" fill="none" stroke="#3E174A" stroke-width="8"/>
  <circle cx="407" cy="108" r="45" fill="none" stroke="#C74EC7" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="155 128" transform="rotate(-90 407 108)"/>
  <text x="407" y="116" text-anchor="middle" class="grade">C+</text>
  <text x="407" y="171" text-anchor="middle" class="small">PUBLIC RANK</text>
