name: Update public GitHub stats

on:
  workflow_dispatch:
  schedule:
    - cron: "29 10 * * *"
  push:
    paths:
      - "scripts/update_public_github_stats.py"

permissions:
  contents: write

concurrency:
  group: profile-public-github-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild public GitHub stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_public_github_stats.py

      - name: Commit card if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/public-github-stats.svg

          if git diff --cached --quiet; then
            echo "Public GitHub stats card is already current."
            exit 0
          fi

          git commit -m "Update public GitHub stats snapshot"
          git push
